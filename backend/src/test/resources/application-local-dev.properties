# Isolates tests that activate the local-dev profile (which seeds fixed
# Person rows, e.g. "alex-morgan") onto their own named in-memory H2
# instance, separate from the shared `workos_test` database used by
# plain-profile tests (PersonRepositoryTest, WorkspacePersistenceTest, ...).
# Without this, LocalDevPeopleSeeder's committed inserts (it runs once at
# context startup, outside any test's @Transactional rollback) would leak
# into the shared database and collide with those tests' own fixture ids.
spring.datasource.url=jdbc:h2:mem:workos_test_local_dev;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

app.local-dev.actor-person-id=sarah-chen
