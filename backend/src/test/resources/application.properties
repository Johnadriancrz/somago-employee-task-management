# Test-only datasource: an isolated in-memory H2 instance in MySQL
# compatibility mode. This overrides src/main/resources/application.properties
# on the test classpath so tests never touch the real workos_db, and never
# need DB_PASSWORD to be set.
spring.datasource.url=jdbc:h2:mem:workos_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true

app.cors.allowed-origins=http://localhost:3000
spring.web.resources.add-mappings=false

# Test-only Admin bootstrap credentials. AdminBootstrapSeeder is registered
# in every profile (including tests), so every @SpringBootTest needs these
# set or context startup fails loudly by design. Never used outside this
# test classpath - not a real deployment credential.
app.initial-admin.email=admin@workos.test
app.initial-admin.password=Test-Admin-Passw0rd!

# Time Clock + Overtime: fixed business timezone for tests, independent of
# whatever zone the machine running the test suite happens to be in.
app.business.zone-id=Asia/Manila
