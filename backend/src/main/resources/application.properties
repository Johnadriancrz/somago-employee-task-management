spring.application.name=workos-backend

# MySQL Database Configuration
# DB_URL/DB_USERNAME fall back to local-dev defaults; DB_PASSWORD has no
# default on purpose (do not commit a real password here) and must be set
# in the environment, e.g. in a local, untracked .env / IDE run config.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/workos_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
# Schema is owned by Flyway migrations (db/migration) as of Step 2A; Hibernate
# only validates entities against that schema, it never generates DDL itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Configuration
spring.flyway.enabled=true

# CORS Configuration
# Comma-separated list of allowed origins for the Next.js frontend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Route unmapped requests to GlobalExceptionHandler instead of the default
# Whitelabel error page, so 404s also use the { "error": "..." } convention.
# (Spring Boot 4 throws NoHandlerFoundException by default; this only turns
# off the default static-resource handler that would otherwise intercept it.)
spring.web.resources.add-mappings=false

# Auth session cookie (Phase 2). Secure by default (not sent over plain
# HTTP) - local-dev overrides this to false since local dev runs over
# http://localhost. No default for a real deployment's secret material is
# needed here since the cookie value itself is a random session token, not a
# credential; the same "no committed secrets" discipline still applies to
# APP_INITIAL_CEO_PASSWORD in a later phase.
app.session.cookie-secure=${SESSION_COOKIE_SECURE:true}

# Step 2B: authentication is deferred, so the Workspace/Board APIs resolve
# "who is acting" via a fixed, server-configured actor instead of a real
# session (see com.workos.workos_backend.actor.ActingPersonResolver). That
# mechanism is registered ONLY under the `local-dev` Spring profile
# (application-local-dev.properties) — without it active
# (--spring.profiles.active=local-dev or SPRING_PROFILES_ACTIVE=local-dev),
# the app will fail to start, by design: there is deliberately no
# production-safe fallback yet. This must be replaced by real
# session/auth-derived identity before any non-local deployment.
