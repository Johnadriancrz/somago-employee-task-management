# LOCAL DEVELOPMENT ONLY. Activated exclusively via
# --spring.profiles.active=local-dev or SPRING_PROFILES_ACTIVE=local-dev.
# Never activate this profile in a shared or production environment.
#
# app.local-dev.actor-person-id: the fixed Person.id treated as "the signed-in
# user" for every request, since real authentication doesn't exist yet (see
# com.workos.workos_backend.actor.LocalDevActingPersonResolver). Must name a
# Person that actually exists — com.workos.workos_backend.dev.LocalDevPeopleSeeder
# seeds the six accounts from workos-app/src/lib/data.ts#PEOPLE (including this
# default) and fails startup clearly if this is pointed at an unknown id.
app.local-dev.actor-person-id=${LOCAL_DEV_ACTOR_PERSON_ID:sarah-chen}
